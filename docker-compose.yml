services:
  # Your local MongoDB already uses 27017, so this one is published on 27018.
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API itself. For local development you usually run only redis (and mongo)
  # with `docker compose up -d redis mongo` and start the API with `npm run dev`.
  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the hosts are the service names, not localhost.
      MONGO_URI: mongodb://mongo:27017/LuqmaFast
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/src/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodata:
  redisdata:
  uploads:
